# Pre-commit runs the same gates as CI, so a red build is something you see before you
# push rather than after. Install once with:  uv run pre-commit install
default_language_version:
  python: python3.12

# Generated stylesheets and vendored libraries are excluded from the whitespace hooks.
# Both are committed build artefacts: rewriting them means the file no longer matches
# what the build produced, and for a vendored library it also breaks the SHA-256 recorded
# alongside it -- which is the only thing making its provenance checkable.
exclude: ^src/aer/web/static/(css|vendor)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy runs from the project environment rather than an isolated pre-commit env, so
  # pre-commit, CI and `uv run mypy` are guaranteed to be the same version seeing the
  # same installed type stubs. A mirrored hook drifts from the lockfile and produces the
  # classic "passes locally, fails in the hook" split.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(uv\.lock|docs/PLAN\.md)$
