# Pre-commit runs the same gates as CI, so a red build is something you see before you
# push rather than after. Install once with:  uv run pre-commit install
default_language_version:
  python: python3.12

# Generated stylesheets, vendored libraries, vendored typefaces and recorded fixtures are
# excluded from the whitespace hooks. All are committed *output* or someone else's bytes:
# rewriting them means the file no longer matches what produced it. For a vendored library
# it also breaks the SHA-256 recorded alongside it -- the only thing making its provenance
# checkable -- and for a fixture it changes the bytes a golden test compares against, so the
# hook and the suite disagree about what the right answer is.
#
# `fonts/` is here for a different reason and it is not fussiness: those directories hold
# the SIL OFL notices the licences require us to ship *with* the fonts. A licence is a
# document we were given, not one we maintain, and trailing-whitespace was quietly editing
# the IBM Plex notice on every run. `just vendor-fonts` copies them back verbatim, so the
# hook and the vendoring recipe would have fought over that line for ever.
exclude: ^(src/aer/web/static/(css|vendor|fonts)/|tests/fixtures/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: no-commit-to-branch
        # `main` is the trunk here, not a branch to protect from yourself.
        args: [--branch, master]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy runs from the project environment rather than an isolated pre-commit env, so
  # pre-commit, CI and `uv run mypy` are guaranteed to be the same version seeing the
  # same installed type stubs. A mirrored hook drifts from the lockfile and produces the
  # classic "passes locally, fails in the hook" split.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(uv\.lock|docs/archive/PLAN\.md)$
