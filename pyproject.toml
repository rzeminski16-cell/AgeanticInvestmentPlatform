[project]
name = "ageiantic-equity-research"
version = "0.1.0"
description = "Local-first, auditable equity research platform for UK and US listed equities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ageiantic Equity Research Platform" }]
keywords = ["equity-research", "finance", "provenance", "point-in-time"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
]

# Runtime dependencies are deliberately minimal at this stage.
# FastAPI, SQLAlchemy, Alembic, anthropic and every data-provider client arrive in
# later tasks, as set out in docs/PLAN.md (Stage 4).
dependencies = [
  "structlog>=24.4",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aer"]

# --------------------------------------------------------------------------------------
# Ruff — linting and formatting (replaces black, isort, flake8 and friends)
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "S",    # flake8-bandit (security)
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez (naive datetimes are a correctness bug in this project)
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "SIM",  # flake8-simplify
  "ARG",  # flake8-unused-arguments
  "PTH",  # flake8-use-pathlib
  "ERA",  # eradicate (commented-out code)
  "PL",   # pylint
  "RUF",  # ruff-specific
]
ignore = [
  "PLR0913", # too many arguments — common and acceptable in typed constructors
  "S101",    # assert — re-enabled for src via per-file-ignores below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # asserts are the point of a test
  "PLR2004", # magic values in assertions are clearer than named constants
  "ARG001",  # pytest fixtures are frequently injected but unused by name
  "S105",    # hardcoded password-alike strings are deliberate test fixtures
  "S106",
]
"src/aer/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["aer"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------------------
# mypy — strict where correctness is load-bearing, normal elsewhere
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
packages = ["aer"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true

# aer.core and aer.calc hold the correctness core: pure, side-effect free, fully typed.
# See docs/adr/0003-deterministic-code-owns-numbers-and-facts.md
[[tool.mypy.overrides]]
module = ["aer.core.*", "aer.calc.*"]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
  "integration: requires the Docker Compose services (Postgres, Redis)",
  "live_llm: performs a real, billable model call; excluded from the default suite",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/aer"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
